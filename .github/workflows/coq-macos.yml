name: CI (Coq, MacOS)

on:
  push:
    branches: [ master , sp2019latest , v8.6 , v8.8 , v8.10 ]
  pull_request:
  merge_group:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '0 0 1 * *'

jobs:
  quick-verify:
    strategy:
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Runner Stabilization
      run: |
        # 1. Intel-specific SMC polling fix
        if [ "$(uname -m)" == "x86_64" ]; then
          sudo defaults -currentHost write /Library/Preferences/com.apple.powerlogd SMCMonitorCadence 0
        fi

        # 2. Disable Spotlight indexing
        sudo mdutil -a -i off || true

        # 3. Unload and kill problematic background services
        SERVICES=(
          com.apple.PerfPowerServices
          com.apple.spindump
          com.apple.tailspind
          com.apple.CoreDuetDaemon
          com.apple.mediaanalysisd
        )
        for s in "${SERVICES[@]}"; do
          sudo launchctl unload -w "/System/Library/LaunchDaemons/${s}.plist" 2>/dev/null || true
        done
        sudo killall PerfPowerServices spindump tailspind distnoted mediaanalysisd 2>/dev/null || true

        # 4. Disable scheduled updates and increase priority
        sudo softwareupdate --schedule off
        sudo renice -n -15 -p $$
    - name: CI Performance Diagnostics
      run: |
        echo "::group::CPU usage"
        ps auxww | grep -E "%CPU|PerfPowerServices" | grep -v grep || true
        echo "::endgroup::"
        echo "::group::System Load"
        top -l 1 | head -n 10
        echo "::endgroup::"
        echo "::group::Spotlight Status"
        sudo mdutil -s /
        echo "::endgroup::"
